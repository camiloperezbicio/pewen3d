<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Copiar Datos</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --border: rgba(148, 163, 184, 0.2);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background:
        radial-gradient(circle at top, rgba(56, 189, 248, 0.18), transparent 35%),
        linear-gradient(135deg, #020817 0%, #0f172a 40%, #111827 100%);
      color: var(--text);
    }

    .card {
      width: min(92vw, 700px);
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      padding: 24px;
      backdrop-filter: blur(8px);
    }

    .title {
      margin: 0 0 16px;
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text);
    }

    textarea {
      width: 100%;
      min-height: 220px;
      resize: vertical;
      padding: 18px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #0b1120;
      color: var(--text);
      font-size: 15px;
      line-height: 1.7;
      outline: none;
      box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.06);
    }

    textarea:focus {
      border-color: rgba(56, 189, 248, 0.8);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.12);
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 16px;
    }

    button {
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: #03131f;
      font-weight: 700;
      padding: 12px 20px;
      font-size: 0.98rem;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 8px 18px rgba(14, 165, 233, 0.35);
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(14, 165, 233, 0.45);
    }

    button:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="card">
    <h2 class="title">Datos para copiar</h2>
    <textarea id="texto" readonly>Camilo eduardo Perez
193709443
camilo.perez.nahuelhual@gmail.com
BANCO_FALABELLA
Cuenta Corriente
1-980-216447-0</textarea>

    <div class="actions">
      <button onclick="copiarTexto()">Copiar todo</button>
    </div>
  </div>

  <script>
    async function copiarTexto() {
      const texto = document.getElementById('texto').value;
      try {
        await navigator.clipboard.writeText(texto);
        alert('Texto copiado correctamente.');
      } catch (err) {
        const area = document.getElementById('texto');
        area.focus();
        area.select();
        document.execCommand('copy');
        alert('Texto copiado correctamente.');
      }
    }
  </script>
</body>
</html>
